[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Board của nhóm truyền Serial qua chip USB-UART nên KHÔNG bật USB CDC.
; Nếu dùng board chỉ có cổng USB trực tiếp của ESP32-C3 (không có chip CH340/CP2102),
; bỏ dấu ; ở 3 dòng dưới:
;build_flags =
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1
